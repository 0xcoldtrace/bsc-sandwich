# BSC Sandwich Bot — config.toml
# Thiếu field bất kỳ = fail load (xem src/config.rs).
# Ship mặc định: dry_run, không live, không gửi tx thật.

chain_id = 56
dry_run = true
allow_live = false
bot_armed = false

scan_v2 = true
scan_v3 = true
scan_v4 = true

live_v2 = false
live_v3 = false
live_v4 = false

min_profit_bnb = 0.002
max_front_bnb = 5
min_reserve_wbnb = 20

victims_path = "victims.txt"
victims_reload_sec = 15
config_reload_sec = 15

# Cụm 5.2: cadence (ms) fallback poll txpool_content khi BSC_WS trễ/rớt kết
# nối (không liên quan victims_reload_sec/config_reload_sec, đó là
# ngưỡng hot-reload, đây là cadence đọc mempool qua HTTP).
pending_poll_ms = 400

# Cụm 5.3: số hash pending-tx MỚI (chưa xử lý) tối đa mỗi vòng poll
# txpool_content — chặn 1 vòng poll spawn quá nhiều handle_paper_tx khi
# mempool đông.
pending_txpool_max_per_poll = 32

gas_reserve_bnb_wei = 5000000000000000
front_max_gas_bnb_wei = 3000000000000000
back_max_gas_bnb_wei = 3000000000000000

tx_timeout_sec = 30
ws_silence_sec = 60
max_consecutive_loss = 3
max_exposure_bnb = 5

web_bind = "127.0.0.1"
web_port = 8787

max_roundtrip_tax = 0.005
tax_cache_blocks = 30

# Cụm tax-cache-inject: cho phép POST /api/tax + state/tax_inject.jsonl ghi
# TaxCache lúc bot đang chạy (KHÔNG liên quan cổng live). false = API/file bị
# bỏ qua, giữ nguyên luật "chưa đo -> honeypot_or_tax".
allow_tax_inject = true

# Cụm 7.3 (BAOCAO16): build calldata paper (front-buy/back-sell) từ SandwichQuote.
# deadline = wall-clock hiện tại + buffer này (giây) — KHÔNG phải block.timestamp
# on-chain thật (executor.rs không có Provider). CHỈ dùng để build/log calldata
# paper, không liên quan cổng live/dry_run.
executor_deadline_buffer_sec = 120

# Cụm pair-mode: PairBook theo dõi POOL (token/WBNB) chỉ định trực tiếp qua
# pairs.txt, khác victims.txt (theo dõi ĐỊA CHỈ VÍ). min_swap là NGƯỠNG
# GLOBAL áp dụng cho MỌI pool trong pairs.txt (không có min riêng từng pool).
pairs_path = "pairs.txt"
pairs_reload_sec = 30
pairs_min_swap_bnb = 0.05

# Cụm universal-pair-scan: true = quét MỌI pool WBNB (không chỉ pool khai
# trong pairs.txt), dùng LẠI ngưỡng pairs_min_swap_bnb (không thêm ngưỡng
# riêng). Default false = AN TOÀN, giữ nguyên hành vi cũ (not_in_list) — Chủ
# phải tự bật, tăng tải RPC/CPU (mọi pool WBNB đều thành candidate sim).
pair_scan_universal = false

# Cụm explicit-mode-flags: cờ TƯỜNG MINH bật/tắt từng nhánh candidate trong
# decide_paper_v2 (wallet=victims.txt, pair=pairs.txt, universal=mọi pool WBNB
# ở trên). Thứ tự ưu tiên khi nhiều hơn 1 mode bật cùng lúc GIỮ NGUYÊN:
# wallet > pair > universal > not_in_list. Code KHÔNG ép buộc chỉ-1-mode —
# Chủ tự quản lý tổ hợp, hot-reload theo config_reload_sec.
#
# Cụm `strategy-lock-mode2` (Chủ chốt 2026-09-15): CHỈ mode 2 (pair-mode).
# `wallet_scan_enabled=false` (mode 1 TẮT, KHÔNG xoá code — victims.txt vẫn
# đọc được, chỉ không dùng làm candidate). `pair_scan_enabled=true` (mode 2,
# NGUỒN CANDIDATE DUY NHẤT). `pair_scan_universal` ở trên GIỮ `false` (mode 3
# TẮT). Đổi lại `true` nếu Chủ ra lệnh quay về đa-mode.
wallet_scan_enabled = false
pair_scan_enabled = true

# Cụm usdt-quote-asset (BAOCAO29): quote asset thứ 2 ngang hàng WBNB (theo
# giao dịch của NẠN NHÂN - victim mua bằng USDT thì front-run bằng USDT,
# không quy đổi/không trộn với WBNB trong 1 đường sim). scan_quote_usdt=false
# là mặc định AN TOÀN - hành vi WBNB (V2/V3/V4, victims.txt, pairs.txt) KHÔNG
# đổi gì khi tắt cờ này. 3 ngưỡng dưới là SỐ KHỞI TẠO THÔ do Code chọn (KHÔNG
# price oracle, KHÔNG quy đổi từ *_bnb) - Chủ tự chỉnh tự do trong file này,
# hot-reload theo config_reload_sec giống mọi ngưỡng khác.
scan_quote_usdt = true
min_profit_usdt = 3.0
max_front_usdt = 3000.0
min_reserve_usdt = 15000.0

# Cụm evm-validate-fixed-then-wire (B3.1): động cơ quyết định Simulated/
# victim_would_revert/lợi nhuận. "evm" = fork block hiện tại qua revm + chạy
# calldata router THẬT (thấy fee-on-transfer/honeypot thật). "v2" = công thức
# đóng sim_v2 (không mở fork mỗi tx). Giá trị khác 2 chuỗi này = FAIL LOAD
# (không âm thầm rơi về mặc định).
#
# Cụm `strategy-lock-mode2` (Chủ chốt 2026-09-15): SHIP = "v2" — đường nóng
# (pairs.txt đã vet tay) KHÔNG cần mở fork EVM mỗi tx nữa, vì token đã xác
# nhận không tax/honeypot TRƯỚC khi vào pairs.txt (xem CLAUDE.md mục
# "Chiến lược đã chốt"). "evm" vẫn dùng được (đổi tay field này) cho vet
# nền/đo lại trước ký live/validator — 3 việc đó KHÔNG đi qua field này, xem
# `pairs_vet_task`/`spawn_victim_validator`.
sim_engine = "v2"

# Cụm `strategy-lock-mode2`: task nền `pairs_vet_task` chạy `measure_tax_evm`
# (revm) cho MỌI entry `pairs.txt` đã có `vetted` mỗi khoảng này (giây), độc
# lập với đường nóng. KHÔNG liên quan `config_reload_sec` (đó là hot-reload
# ngưỡng, đây là cadence vet nền).
# Cụm `real-economics-mode2` (F-03): số gas UNIT fallback cho front-buy/
# back-sell khi chưa đo được thật bằng revm lúc boot (đo 1 lần trên 1 pair
# đã vet trong pairs.txt, cache; đo lỗi thì dùng 2 field này). front_max_gas_bnb_wei/
# back_max_gas_bnb_wei ở trên GIỜ CHỈ LÀ TRẦN so với gas_cost_wei đo thật
# (units * max(eth_gasPrice, gas_price victim)), không còn dùng thẳng làm
# chi phí gas trừ vào profit nữa.
gas_units_front = 160000
gas_units_back = 140000
# gas_price_max_gwei: eth_gasPrice đo được > ngưỡng này (mạng tắc nghẽn bất
# thường) -> skip gas_cap, không đoán gas sẽ rẻ lại kịp lúc.
gas_price_max_gwei = 10

pairs_vet_interval_sec = 600

# Cụm `strategy-lock-mode2`: true = entry `pairs.txt` KHÔNG có `vetted
# YYYY-MM-DD` hợp lệ bị loại khỏi candidate (log `pair.unvetted`, KHÔNG sim).
# false = giữ hành vi cũ (mọi entry resolve được đều thành candidate, bất kể
# đã vet hay chưa) — CHỈ dùng khi Chủ chủ động tắt gate vet (không phải mặc
# định an toàn).
pairs_require_vetted = true

# Cụm evm-validate-fixed-then-wire (C2): TTL (giây) cho TaxCache đo tự động
# bằng revm. tax_cache_blocks ở trên VẪN đọc được (không phá config cũ) nhưng
# KHÔNG còn quyết định tươi/cũ — TTL theo thời gian thực mới là ngưỡng thật.
tax_cache_ttl_sec = 600

# Cụm evm-validate-fixed-then-wire (D1), wire thật vào build ở cụm
# exec-path-traps (F-08): slippage tách riêng 2 chân sandwich. front-buy chạy
# TRƯỚC victim (giá gần như chắc chắn) nên siết chặt; back-sell chạy SAU
# victim (giá đã dịch + có thể dính tax bán) nên nới rộng hơn. Field
# `executor_slippage_bps` (bản gộp chung cũ) đã XOÁ — còn trong file này thì
# fail load kèm thông báo đổi tên (xem src/config.rs).
front_slippage_bps = 10
back_slippage_bps = 50

# Cụm competitor-recon-and-strategy (F-02, mo hinh bribe MO PHONG, CHUA gui
# that): bribe_pct_of_profit = % loi nhuan GOP (truoc bribe) dung lam bribe de
# canh tranh vi tri trong block; profit_net_after_bribe = profit_net - bribe,
# Simulated CHI KHI profit_net_after_bribe > min_profit_bnb (thay vi profit_net
# tho nhu truoc cum nay). Kep giua [bribe_min_bnb, bribe_max_bnb] (0 =
# khong tran). Moc 40%/0.0005/0.01 la SO KHOI TAO THO (chua du mau doi thu
# that de hieu chinh rieng, xem baocao/evidence/competitor_recon_run1.txt) -
# Chu tu chinh theo trinh sat cap nhat. bribe_mode chi la NHAN cho executor
# tuong lai chon co che gui (coinbase transfer hoac tang priority fee) - CHUA
# co code gui bribe that trong cum nay (xem CLAUDE.md cum strategy-exec).
bribe_pct_of_profit = 40.0
bribe_min_bnb = 0.0005
bribe_max_bnb = 0.01
# BO SUNG GIUA PHIEN 2026-09-16 (docs chinh thuc BlockRazor + 48 Club Chu dan):
# bribe KHONG di toi block.coinbase (mo hinh Flashbots/Ethereum) ma toi VI EOA
# CUA BUILDER bang 1 transfer BNB dat trong CHAN BACK cua bundle. Gia tri cu
# "coinbase" = FAIL LOAD (ngu nghia da khac han, khong nhan am tham).
bribe_mode = "builder_transfer"
# Vi EOA builder theo tung relay (pin + source_url + ngay trong DEX_REGISTRY.md).
blockrazor_builder_eoa = "0x1266C6bE60392A8Ff346E8d5ECCd3E69dD9c5F20"
# 48 Club xep hang bundle = 0.9 x gas fee tx unique + BNB chuyen toi EOA nay
# -> uu tien nhet bribe vao TRANSFER, giu gas o muc toi thieu 0.05 gwei.
club48_builder_eoa = "0x4848489f0b2BEdd788c696e2D79b6b69D7484848"

# Cum competitor-recon-and-strategy (muc 4, shadow mode): "off" (ship - KHONG
# load signer, hanh vi 100% giong truoc cum nay), "shadow" (KY THAT bang
# PRIVATE_KEY trong .env, KHONG BAO GIO gui/broadcast - chi log bundle.shadow),
# "live" (CHUA lam trong cum nay, van can cum strategy-exec + lenh rieng cua
# Chu - doc field nay KHONG tu mo khoa gui that, xem executor::can_send_live).
live_mode = "off"

# Cum `bugfix-presign-and-contract-plan` (A3) - tx cua CUM DOI THU da nhan
# dien (3 dia chi seed da verify on-chain + moi vi vua nhan quote-asset tu 1
# trong 3 dia chi do trong block hien tai/truoc - xem src/competitor.rs) co
# duoc coi la nan nhan hop le khong. false (ship): khi live_mode != "off"
# (da co kha nang KY that), candidate nhom nay bi skip `competitor_victim`.
# O live_mode="off" (paper thuan) co nay KHONG chan gi - van Simulated va van
# ghi co `victim_in_competitor_cluster` vao sim.result de /api/econ dem duoc.
allow_competitor_victims = false

# ===== Cum `planB-backrun-opportunity` (Chu chot 2026-09-16) =====
# strategy: "backrun" (ship) = backrun-arb nguyen tu bang flash loan, KHONG
# can dung truoc victim, KHONG can victim_ok, KHONG can von xoay. "sandwich" =
# duong cu (front/back kep victim) - code GIU NGUYEN, chi tat bang field nay.
# Gia tri khac 2 chuoi nay = FAIL LOAD.
strategy = "backrun"

# Tran so tien VAY FLASH moi route arb. KHAC max_front_bnb (do la tran VON TU
# CO cua sandwich) - tien nay vay va tra trong cung 1 tx, tran chi de chan
# truot gia/gas, khong phai chan von.
arb_max_borrow_bnb = 20
arb_max_borrow_usdt = 12000

# Chu ky (giay) task nen doc lai chieu sau + phi cac nguon flash (Infinity
# Vault / Balancer V2 / Aave V3). Duong nong CHI doc snapshot da chup.
flash_source_interval_sec = 300

# Ban do venue thu 2 (sinh boi `cargo run --release --bin build_multi_venue`).
# Thieu file = moi tx `arb_no_second_venue`, bot KHONG crash.
multi_venue_path = "state/multi_venue.json"

# Gas UNIT do that cho 2 kieu route arb (BAOCAO47): 2-3 hop V2 revm = 339808..347747
# (p50 339836). Infinity lock/take/sync/settle chua chen bytecode callback duoc
# (cong ~80k theo kich thuoc lock tx on-chain) -> 420000. V2 pancakeCall ~40k
# overhead -> 380000. Chua phai toan bo lock path trong 1 tx revm.
gas_units_arb_infinity = 420000
gas_units_arb_v2flash = 380000
