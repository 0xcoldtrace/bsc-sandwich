[package]
name = "bsc_sandwich"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsc_sandwich"
path = "src/lib.rs"

[[bin]]
name = "bsc_sandwich"
path = "src/main.rs"

[[bin]]
name = "rpc_probe"
path = "src/bin/rpc_probe.rs"

[[bin]]
name = "competitor_recon"
path = "src/bin/competitor_recon.rs"

[[bin]]
name = "build_multi_venue"
path = "src/bin/build_multi_venue.rs"

[[bin]]
name = "discover_multivenue"
path = "src/bin/discover_multivenue.rs"

[[bin]]
name = "arb_measure"
path = "src/bin/arb_measure.rs"

[[bin]]
name = "arb_crosscheck"
path = "src/bin/arb_crosscheck.rs"

[[bin]]
name = "arb_replay_18"
path = "src/bin/arb_replay_18.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
alloy-primitives = "1"
alloy = { version = "2", default-features = false, features = ["std", "provider-http", "provider-ws", "rpc-types-eth", "reqwest-rustls-tls", "sol-types", "signer-local"] }
url = "2"
revm = { version = "43", default-features = false, features = ["std", "alloydb", "asyncdb"] }
alloy-signer-local = "2.4.2"

[dev-dependencies]
tempfile = "3"
